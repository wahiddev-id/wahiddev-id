name: Generate Contribution Snake

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%231E3A8A&color_dots=%23F1F5F9,%23BFDBFE,%2393C5FD,%2360A5FA,%232563EB
            dist/github-contribution-grid-snake-dark.svg?color_snake=%2360A5FA&color_dots=%23161B22,%230E2A5E,%231D4ED8,%232563EB,%233B82F6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}